name: smriti_care
description: "Smriti Care — AI-powered cognitive care and safety platform for elderly dementia patients."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Navigation
  go_router: ^14.0.0

  # Fonts matching the React app (DM Sans)
  google_fonts: ^6.2.1

  # Local file storage for offline games & stats
  path_provider: ^2.1.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/i18n/
