name: smriti_care
description: "Smriti Care — AI-powered cognitive care and safety platform for elderly dementia patients."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Fonts matching the React app (DM Sans)
  google_fonts: ^6.2.1

  # Local file storage for offline games & stats
  path_provider: ^2.1.2

  # Networking for FastAPI AI backend communication
  http: ^1.2.2

  # FIX: Added file_picker for real MRI/PDF/image file selection from device storage
  # Version ^12.3.0 resolves win32 conflict with geolocator ^14.0.3
  file_picker: ^12.3.0

  # Icons
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  pedometer: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/i18n/
