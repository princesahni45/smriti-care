# AI-Assisted Brain MRI Dementia Severity Estimation Configuration

project:
  name: "mri_dementia"
  version: "1.0.0"
  disclaimer: "This AI result is for research/educational assistance only and is not a medical diagnosis."
  label_header: "AI-Assisted Dementia Severity Estimation"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  metadata_path: "data/metadata/oasis_cross-sectional.xlsx"
  dataset_csv: "data/metadata/mri_dataset.csv"
  models_dir: "models"
  reports_dir: "reports"
  gradcam_dir: "reports/gradcam"

target_classes:
  num_classes: 3
  mapping:
    0: "Normal"
    1: "Very Mild Dementia"
    2: "Dementia (Mild/Moderate)"
  cdr_rules:
    0.0: 0
    0.5: 1
    1.0: 2
    2.0: 2

preprocessing:
  target_shape: [96, 96, 96]
  prefer_masked: true
  clip_percentiles: [0.5, 99.5]
  normalize: "zscore"  # options: "zscore", "minmax"
  remove_background_padding: true

augmentation:
  enabled: true
  rotation_degrees: 7.0
  translation_fraction: 0.05
  scaling_range: [0.95, 1.05]
  noise_std: 0.02

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  stratified: true

model:
  architecture: "resnet10_3d"  # options: "resnet10_3d", "resnet18_3d", "densenet3d", "custom_cnn3d"
  in_channels: 1
  num_classes: 3
  dropout: 0.3

training:
  epochs: 35
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  patience: 8
  mixed_precision: true
  gradient_accumulation_steps: 1
  use_weighted_sampler: true
  use_class_weights: true

inference:
  confidence_threshold: 0.55
  low_confidence_message: "Low-confidence prediction — further clinical assessment recommended."
